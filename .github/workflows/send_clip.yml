name: Send Random Twitch Clip

on:
  schedule:
    - cron: '0 * * * *'   # щогодини; скрипт сам вирішує, чи зараз 17:00 Вт/Чт по Києву
  workflow_dispatch:        # можливість запустити вручну для тесту

permissions:
  contents: write

concurrency:
  group: send-clip
  cancel-in-progress: false

jobs:
  send-clip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run clip bot
        run: python send_clip.py
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_BROADCASTER_ID: ${{ secrets.TWITCH_BROADCASTER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_PERSONAL_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE_RUN: "1"

      - name: Commit updated state (if changed)
        run: |
          git config user.name "clip-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent_clips.json
          git diff --staged --quiet || git commit -m "chore: update sent clips list"
          git push
